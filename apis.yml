aid: welldoc
name: Welldoc
description: Welldoc is a Columbia, Maryland digital health company whose FDA-cleared, AI-driven cardiometabolic
  care platform — best known through its BlueStar digital therapeutic for type 1 and type 2 diabetes — delivers
  personalized, real-time coaching and clinical decision support across 30+ chronic conditions including diabetes,
  hypertension, weight management and complex comorbid cardiometabolic disease. The platform ingests data from 400+
  connected devices and data sources (blood glucose meters, CGMs, pharmacies, labs, activity trackers) and is sold
  to health plans, health systems, employers, life science companies, DMEs and medtech partners rather than to developers.
  Welldoc markets SDK and API access as a partnering option — "we offer our capabilities, AI models, and data integration
  through your interface via SDK and API" — but publishes no developer portal, API reference, or machine-readable
  contract; access is negotiated through a demo/partnering conversation.
